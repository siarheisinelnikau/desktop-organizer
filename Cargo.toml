[package]
name = "desktop-organizer"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Visual desktop groups with optional metadata-only AI suggestions"
repository = "https://github.com/siarheisinelnikau/desktop-organizer"

[dependencies]
rust-auto-updator = { path = "../rust-auto-updator/crates/rust-auto-updator" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
sha2 = "0.10"
ureq = { version = "3.5", features = ["json"] }
png = "0.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
    "Win32_System_DataExchange", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Com",
    "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
winresource = "=0.1.34"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
strip = "debuginfo"

[[bin]]
name = "DesktopOrganizer"
path = "src/main.rs"
