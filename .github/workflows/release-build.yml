name: Checked release builds
'on':
  workflow_call: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  verify:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Provision shared updater source
      shell: pwsh
      run: ./scripts/provision-shared-updater.ps1
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: rustfmt, clippy
        toolchain: stable
    - name: Resolve locked dependencies
      run: cargo fetch --locked
    - name: Format, lint, test fixtures and compile
      shell: pwsh
      run: ./scripts/check.ps1
    - name: Prepare portable asset and notices
      shell: pwsh
      run: ./scripts/package.ps1
    - name: Inspect PE headers and embedded manifest without execution
      shell: pwsh
      run: |
        $assets = @(Get-ChildItem -LiteralPath dist -Filter '*.exe')
        if ($assets.Count -ne 1) { throw 'Expected exactly one executable architecture.' }
        python scripts/inspect_binary.py $assets[0].FullName
        if ($LASTEXITCODE -ne 0) { throw 'PE inspection failed.' }
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: DesktopOrganizer-windows-portable
        path: dist/*
        if-no-files-found: error
    permissions:
      contents: read
    timeout-minutes: 30
