name: Windows verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve locked dependencies
        run: cargo fetch --locked
      - name: Format, lint, test fixtures and compile
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Prepare portable asset and notices
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Inspect PE headers and embedded manifest without execution
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -Filter '*.exe')
          if ($assets.Count -ne 1) { throw 'Expected exactly one executable architecture.' }
          python scripts/inspect_binary.py $assets[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'PE inspection failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopOrganizer-windows-portable
          path: dist/*
          if-no-files-found: error

  localization-release:
    name: Publish the explicitly requested localization release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release localization v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: localization-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DesktopOrganizer-windows-portable
          path: .release-input
      - name: Verify the checked executable, companion and notices
        shell: pwsh
        run: ./scripts/stage-localization-release.ps1
      - name: Publish only after every asset is verified
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-localization-release.cjs');
            await publish({github, context, core});
